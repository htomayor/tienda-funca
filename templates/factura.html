{% extends "base.html" %}

{% block title %}Factura - Tienda FUNCA{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="fas fa-file-invoice"></i> Factura</h1>
            <button class="btn btn-primary" onclick="window.print()">
                <i class="fas fa-print"></i> Imprimir
            </button>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card" id="factura-content">
            <div class="card-body">
                <div id="factura-info"></div>
                <hr>
                <h5>Productos</h5>
                <div class="table-responsive">
                    <table class="table table-striped" id="factura-productos">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Precio Unit.</th>
                                <th>Subtotal</th>
                                <th>Estado Entrega</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                        <tfoot>
                            <tr class="fw-bold">
                                <td colspan="3">Total:</td>
                                <td id="factura-total">$0</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const facturaId = urlParams.get('id');

function cargarFactura() {
    fetch(`/api/ventas/${facturaId}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                document.getElementById('factura-info').innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                return;
            }
            
            document.getElementById('factura-info').innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Factura:</strong> ${data.numero_factura}</p>
                        <p><strong>Fecha:</strong> ${new Date(data.fecha_venta).toLocaleString()}</p>
                        <p><strong>Estado:</strong> <span class="badge bg-${data.estado === 'completada' ? 'success' : 'warning'}">${data.estado}</span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Cliente:</strong> ${data.cliente_nombre}</p>
                        <p><strong>Documento:</strong> ${data.cliente_documento}</p>
                        <p><strong>Forma de Pago:</strong> ${data.forma_pago || 'Efectivo'}</p>
                    </div>
                </div>
            `;
            
            let productosHtml = '';
            data.detalles.forEach(item => {
                const estadoEntrega = item.entregado_cliente ? 
                    '<span class="badge bg-success">Entregado</span>' : 
                    '<span class="badge bg-warning">Pendiente entrega</span>';
                productosHtml += `
                    <tr>
                        <td>${item.producto_nombre}</td>
                        <td>${item.cantidad}</td>
                        <td>$${formatNumber(item.precio_unitario)}</td>
                        <td>$${formatNumber(item.subtotal)}</td>
                        <td>${estadoEntrega}</td>
                    </tr>
                `;
            });
            
            document.querySelector('#factura-productos tbody').innerHTML = productosHtml;
            document.getElementById('factura-total').innerHTML = `$${formatNumber(data.total)}`;
        });
}

document.addEventListener('DOMContentLoaded', cargarFactura);
</script>
{% endblock %}
