{% extends "base.html" %}

{% block title %}Categorías - Tienda FUNCA{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="fas fa-tags"></i> Categorías de Productos</h1>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalCategoria" onclick="limpiarFormulario()">
                <i class="fas fa-plus"></i> Nueva Categoría
            </button>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <div class="row">
                    <div class="col-md-6">
                        <input type="text" id="buscarCategoria" class="form-control" placeholder="Buscar categoría...">
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Fecha Creación</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-categorias">
                            <tr><td colspan="5" class="text-center">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para Categoría -->
<div class="modal fade" id="modalCategoria" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="fas fa-tag"></i> Categoría</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formCategoria">
                    <input type="hidden" id="categoria_id">
                    <div class="mb-3">
                        <label class="form-label">Nombre *</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea id="descripcion" class="form-control" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="guardarCategoria()">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script>
let categoriasData = [];

function cargarCategorias() {
    fetch('/api/categorias')
        .then(response => response.json())
        .then(data => {
            categoriasData = data;
            mostrarCategorias(data);
        })
        .catch(error => console.error('Error:', error));
}

function mostrarCategorias(categorias) {
    const tbody = document.getElementById('tabla-categorias');
    if (categorias.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center">No hay categorías</td></tr>';
        return;
    }
    
    let html = '';
    categorias.forEach(c => {
        html += `
            <tr>
                <td>${c.id}</td>
                <td><strong>${c.nombre}</strong></td>
                <td>${c.descripcion || '-'}</td>
                <td>${c.created_at ? new Date(c.created_at).toLocaleDateString() : '-'}</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="editarCategoria(${c.id})">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="eliminarCategoria(${c.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `;
    });
    tbody.innerHTML = html;
}

function limpiarFormulario() {
    document.getElementById('categoria_id').value = '';
    document.getElementById('nombre').value = '';
    document.getElementById('descripcion').value = '';
}

function editarCategoria(id) {
    const categoria = categoriasData.find(c => c.id === id);
    if (categoria) {
        document.getElementById('categoria_id').value = categoria.id;
        document.getElementById('nombre').value = categoria.nombre;
        document.getElementById('descripcion').value = categoria.descripcion || '';
        new bootstrap.Modal(document.getElementById('modalCategoria')).show();
    }
}

function guardarCategoria() {
    const id = document.getElementById('categoria_id').value;
    const data = {
        nombre: document.getElementById('nombre').value,
        descripcion: document.getElementById('descripcion').value
    };
    
    if (!data.nombre) {
        mostrarAlerta('El nombre es requerido', 'warning');
        return;
    }
    
    const url = id ? `/api/categorias/${id}` : '/api/categorias';
    const method = id ? 'PUT' : 'POST';
    
    fetch(url, {
        method: method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => {
        if (data.id || data.message) {
            bootstrap.Modal.getInstance(document.getElementById('modalCategoria')).hide();
            cargarCategorias();
            // También recargar productos para actualizar selects
            if (typeof cargarProductos === 'function') cargarProductos();
            if (typeof cargarProductosTienda === 'function') cargarProductosTienda();
            mostrarAlerta('Categoría guardada exitosamente', 'success');
        } else {
            mostrarAlerta(data.error || 'Error al guardar', 'danger');
        }
    });
}

function eliminarCategoria(id) {
    // Verificar si hay productos usando esta categoría
    fetch('/api/productos')
        .then(response => response.json())
        .then(productos => {
            const productosEnCategoria = productos.filter(p => p.categoria_id === id);
            if (productosEnCategoria.length > 0) {
                mostrarAlerta(`No se puede eliminar: ${productosEnCategoria.length} producto(s) usan esta categoría`, 'danger');
                return;
            }
            
            if (confirm('¿Eliminar esta categoría?')) {
                fetch(`/api/categorias/${id}`, {method: 'DELETE'})
                    .then(response => response.json())
                    .then(data => {
                        if (data.message) {
                            cargarCategorias();
                            mostrarAlerta('Categoría eliminada', 'success');
                        } else {
                            mostrarAlerta(data.error || 'Error al eliminar', 'danger');
                        }
                    });
            }
        });
}

// Búsqueda
document.getElementById('buscarCategoria').addEventListener('keyup', (e) => {
    const search = e.target.value.toLowerCase();
    const filtrados = categoriasData.filter(c => 
        c.nombre.toLowerCase().includes(search) || 
        (c.descripcion && c.descripcion.toLowerCase().includes(search))
    );
    mostrarCategorias(filtrados);
});

document.addEventListener('DOMContentLoaded', () => {
    cargarCategorias();
});
</script>
{% endblock %}
