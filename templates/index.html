{% extends "base.html" %}

{% block title %}Dashboard - Tienda FUNCA{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4"><i class="fas fa-tachometer-alt"></i> Dashboard</h1>
    </div>
</div>

<!-- Tarjetas de estadísticas -->
<div class="row mb-4">
    <div class="col-md-3 mb-3">
        <div class="card text-white bg-primary h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="card-title">Total Productos</h6>
                        <h2 class="mb-0" id="total-productos">-</h2>
                    </div>
                    <i class="fas fa-boxes fa-3x opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-3 mb-3">
        <div class="card text-white bg-warning h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="card-title">Stock Bajo</h6>
                        <h2 class="mb-0" id="stock-bajo">-</h2>
                    </div>
                    <i class="fas fa-exclamation-triangle fa-3x opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-3 mb-3">
        <div class="card text-white bg-success h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="card-title">Ventas Hoy</h6>
                        <h2 class="mb-0" id="ventas-hoy">-</h2>
                        <small id="ventas-hoy-total">$0</small>
                    </div>
                    <i class="fas fa-shopping-cart fa-3x opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-3 mb-3">
        <div class="card text-white bg-info h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="card-title">Valor Inventario</h6>
                        <h2 class="mb-0" id="valor-inventario">-</h2>
                    </div>
                    <i class="fas fa-dollar-sign fa-3x opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Gráficos -->
<div class="row">
    <div class="col-md-8 mb-4">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-chart-line"></i> Ventas del Mes
            </div>
            <div class="card-body">
                <canvas id="ventasChart" height="300"></canvas>
            </div>
        </div>
    </div>
    
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-trophy"></i> Top Productos
            </div>
            <div class="card-body">
                <ul class="list-group" id="top-productos">
                    <li class="list-group-item">Cargando...</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
function formatNumber(num) {
    return new Intl.NumberFormat('es-CO').format(num);
}

// Cargar estadísticas
fetch('/api/dashboard/stats')
    .then(response => response.json())
    .then(data => {
        document.getElementById('total-productos').textContent = data.total_productos || 0;
        document.getElementById('stock-bajo').textContent = data.stock_bajo || 0;
        document.getElementById('ventas-hoy').textContent = data.ventas_hoy || 0;
        document.getElementById('ventas-hoy-total').textContent = '$' + formatNumber(data.ventas_hoy_total || 0);
        document.getElementById('valor-inventario').textContent = '$' + formatNumber(data.valor_inventario || 0);
        
        const topList = document.getElementById('top-productos');
        topList.innerHTML = '';
        if (data.top_productos && data.top_productos.length > 0) {
            data.top_productos.forEach(p => {
                topList.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                    ${p.nombre} <span class="badge bg-primary rounded-pill">${p.total} vendidos</span>
                </li>`;
            });
        } else {
            topList.innerHTML = '<li class="list-group-item text-center">No hay datos</li>';
        }
    })
    .catch(error => {
        console.error('Error:', error);
        document.getElementById('total-productos').textContent = 'Error';
    });

// Gráfico de ventas
const ctx = document.getElementById('ventasChart').getContext('2d');
new Chart(ctx, {
    type: 'line',
    data: {
        labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun'],
        datasets: [{
            label: 'Ventas (COP)',
            data: [1200000, 1900000, 3000000, 2500000, 4200000, 3800000],
            borderColor: 'rgb(75, 192, 192)',
            backgroundColor: 'rgba(75, 192, 192, 0.1)',
            tension: 0.1,
            fill: true
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
            tooltip: {
                callbacks: {
                    label: function(context) {
                        return '$' + formatNumber(context.raw);
                    }
                }
            }
        }
    }
});
</script>
{% endblock %}
