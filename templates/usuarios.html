{% extends "base.html" %}

{% block title %}Usuarios - Tienda FUNCA{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="fas fa-users"></i> Gestión de Usuarios</h1>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalUsuario" onclick="limpiarFormulario()">
                <i class="fas fa-plus"></i> Nuevo Usuario
            </button>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Último Acceso</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para usuario -->
<div class="modal fade" id="modalUsuario" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Usuario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formUsuario">
                    <input type="hidden" id="usuario_id">
                    <div class="mb-3">
                        <label class="form-label">Usuario *</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre *</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" placeholder="Dejar en blanco para mantener">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol *</label>
                        <select id="rol" class="form-select" required>
                            <option value="admin">Administrador</option>
                            <option value="vendedor">Vendedor</option>
                            <option value="invitado">Invitado (solo vista)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <select id="activo" class="form-select">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="guardarUsuario()">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script>
function cargarUsuarios() {
    fetch('/api/usuarios')
        .then(response => response.json())
        .then(data => {
            const tbody = document.getElementById('tabla-usuarios');
            tbody.innerHTML = data.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.username}</td>
                    <td>${u.nombre}</td>
                    <td>${u.email || '-'}</td>
                    <td>${u.rol === 'admin' ? '<span class="badge bg-danger">Admin</span>' : u.rol === 'vendedor' ? '<span class="badge bg-success">Vendedor</span>' : '<span class="badge bg-secondary">Invitado</span>'}</td>
                    <td>${u.activo ? '<span class="badge bg-success">Activo</span>' : '<span class="badge bg-danger">Inactivo</span>'}</td>
                    <td>${u.last_login ? new Date(u.last_login).toLocaleString() : '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="editarUsuario(${u.id})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="eliminarUsuario(${u.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        });
}

function guardarUsuario() {
    const id = document.getElementById('usuario_id').value;
    const data = {
        username: document.getElementById('username').value,
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        rol: document.getElementById('rol').value,
        activo: document.getElementById('activo').value === 'true'
    };
    
    const url = id ? `/api/usuarios/${id}` : '/api/usuarios';
    const method = id ? 'PUT' : 'POST';
    
    fetch(url, {
        method: method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => {
        if (data.id || data.message) {
            bootstrap.Modal.getInstance(document.getElementById('modalUsuario')).hide();
            cargarUsuarios();
            mostrarAlerta('Usuario guardado', 'success');
        } else {
            mostrarAlerta(data.error, 'danger');
        }
    });
}

function editarUsuario(id) {
    fetch(`/api/usuarios/${id}`)
        .then(response => response.json())
        .then(u => {
            document.getElementById('usuario_id').value = u.id;
            document.getElementById('username').value = u.username;
            document.getElementById('nombre').value = u.nombre;
            document.getElementById('email').value = u.email || '';
            document.getElementById('rol').value = u.rol;
            document.getElementById('activo').value = u.activo ? 'true' : 'false';
            document.getElementById('password').value = '';
            new bootstrap.Modal(document.getElementById('modalUsuario')).show();
        });
}

function eliminarUsuario(id) {
    if (confirm('¿Eliminar este usuario?')) {
        fetch(`/api/usuarios/${id}`, {method: 'DELETE'})
            .then(() => cargarUsuarios());
    }
}

function limpiarFormulario() {
    document.getElementById('usuario_id').value = '';
    document.getElementById('username').value = '';
    document.getElementById('nombre').value = '';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
    document.getElementById('rol').value = 'vendedor';
    document.getElementById('activo').value = 'true';
}

document.addEventListener('DOMContentLoaded', cargarUsuarios);
</script>
{% endblock %}
