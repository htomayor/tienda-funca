{% extends "base.html" %}

{% block title %}Reporte de Pedidos - Tienda FUNCA{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4"><i class="fas fa-file-alt"></i> Reporte de Productos Bajo Pedido</h1>
        <p class="text-muted">Productos pendientes de recibir del proveedor. Use este reporte para solicitar producción.</p>
    </div>
</div>

<div class="row" id="reporte-container">
    <div class="col-12">
        <div class="alert alert-info">
            <i class="fas fa-spinner fa-spin"></i> Cargando reporte...
        </div>
    </div>
</div>

<script>
function formatNumber(num) {
    return new Intl.NumberFormat('es-CO').format(num);
}

function cargarReporte() {
    fetch('/api/reportes/pedidos-por-proveedor')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('reporte-container');
            
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle"></i> No hay productos pendientes de pedido.
                        </div>
                    </div>
                `;
                return;
            }
            
            let html = '';
            data.forEach(proveedor => {
                let totalProductos = proveedor.productos.length;
                let totalCantidad = proveedor.productos.reduce((sum, p) => sum + p.cantidad_pendiente, 0);
                
                html += `
                    <div class="col-12 mb-4">
                        <div class="card">
                            <div class="card-header bg-primary text-white">
                                <h5><i class="fas fa-truck"></i> ${proveedor.proveedor_nombre}</h5>
                                <small>Total productos: ${totalProductos} | Cantidad total: ${totalCantidad}</small>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-striped">
                                        <thead>
                                            <tr>
                                                <th>Producto</th>
                                                <th>Cantidad Pendiente</th>
                                                <th>Precio Unitario</th>
                                                <th>Subtotal</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                `;
                
                proveedor.productos.forEach(p => {
                    html += `
                        <tr>
                            <td>${p.producto_nombre}</td>
                            <td class="fw-bold">${p.cantidad_pendiente}</td>
                            <td>$${formatNumber(p.precio_unitario)}</td>
                            <td>$${formatNumber(p.cantidad_pendiente * p.precio_unitario)}</td>
                        </tr>
                    `;
                });
                
                let totalGeneral = proveedor.productos.reduce((sum, p) => sum + (p.cantidad_pendiente * p.precio_unitario), 0);
                html += `
                                        </tbody>
                                        <tfoot>
                                            <tr class="fw-bold">
                                                <td colspan="3">Total Pedido:</td>
                                                <td>$${formatNumber(totalGeneral)}</td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                                <button class="btn btn-success mt-2" onclick="generarOrdenCompra(${proveedor.proveedor_id})">
                                    <i class="fas fa-file-pdf"></i> Generar Orden de Compra
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        })
        .catch(error => {
            document.getElementById('reporte-container').innerHTML = `
                <div class="col-12">
                    <div class="alert alert-danger">Error al cargar el reporte: ${error}</div>
                </div>
            `;
        });
}

function generarOrdenCompra(proveedorId) {
    window.open(`/api/orden-compra/${proveedorId}`, '_blank');
}

document.addEventListener('DOMContentLoaded', cargarReporte);
</script>
{% endblock %}
