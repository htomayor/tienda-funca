{% extends "base.html" %}

{% block title %}Clientes - Tienda FUNCA{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="fas fa-users"></i> Clientes</h1>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalCliente" onclick="limpiarFormCliente()">
                <i class="fas fa-plus"></i> Nuevo Cliente
            </button>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <input type="text" id="buscarCliente" class="form-control" placeholder="Buscar por documento, nombre o apellido...">
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tipo</th>
                                <th>Documento</th>
                                <th>Nombres</th>
                                <th>Apellidos</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaClientes"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para cliente -->
<div class="modal fade" id="modalCliente" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="fas fa-user"></i> Cliente</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formCliente">
                    <input type="hidden" id="cliente_id">
                    <div class="mb-3">
                        <label class="form-label">Tipo *</label>
                        <select id="tipo" class="form-select" required>
                            <option value="estudiante">Estudiante</option>
                            <option value="funcionario">Funcionario</option>
                            <option value="externo">Externo</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Documento *</label>
                        <input type="text" id="documento" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombres *</label>
                        <input type="text" id="nombres" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellidos *</label>
                        <input type="text" id="apellidos" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" id="telefono" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <textarea id="direccion" class="form-control" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="guardarCliente()">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script>
let clientesData = [];

function cargarClientes() {
    fetch('/api/clientes')
        .then(response => response.json())
        .then(data => {
            clientesData = data;
            mostrarClientes(data);
        });
}

function mostrarClientes(clientes) {
    const tbody = document.getElementById('tablaClientes');
    if (clientes.length === 0) {
        tbody.innerHTML = '<td><td colspan="8" class="text-center">No hay clientes</td></tr>';
        return;
    }
    
    let html = '';
    clientes.forEach(c => {
        const tipoClass = c.tipo === 'estudiante' ? 'info' : c.tipo === 'funcionario' ? 'primary' : 'secondary';
        html += `
            <tr>
                <td>${c.id}</td>
                <td><span class="badge bg-${tipoClass}">${c.tipo}</span></td>
                <td>${c.documento}</td>
                <td>${c.nombres}</td>
                <td>${c.apellidos}</td>
                <td>${c.telefono || '-'}</td>
                <td>${c.email || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="editarCliente(${c.id})">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="eliminarCliente(${c.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `;
    });
    tbody.innerHTML = html;
}

function guardarCliente() {
    const id = document.getElementById('cliente_id').value;
    const data = {
        tipo: document.getElementById('tipo').value,
        documento: document.getElementById('documento').value,
        nombres: document.getElementById('nombres').value,
        apellidos: document.getElementById('apellidos').value,
        telefono: document.getElementById('telefono').value,
        email: document.getElementById('email').value,
        direccion: document.getElementById('direccion').value
    };
    
    const url = id ? `/api/clientes/${id}` : '/api/clientes';
    const method = id ? 'PUT' : 'POST';
    
    fetch(url, {
        method: method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => {
        if (data.id || data.message) {
            bootstrap.Modal.getInstance(document.getElementById('modalCliente')).hide();
            cargarClientes();
            mostrarAlerta('Cliente guardado exitosamente', 'success');
        } else {
            mostrarAlerta(data.error || 'Error al guardar', 'danger');
        }
    });
}

function editarCliente(id) {
    const cliente = clientesData.find(c => c.id === id);
    if (cliente) {
        document.getElementById('cliente_id').value = cliente.id;
        document.getElementById('tipo').value = cliente.tipo;
        document.getElementById('documento').value = cliente.documento;
        document.getElementById('nombres').value = cliente.nombres;
        document.getElementById('apellidos').value = cliente.apellidos;
        document.getElementById('telefono').value = cliente.telefono || '';
        document.getElementById('email').value = cliente.email || '';
        document.getElementById('direccion').value = cliente.direccion || '';
        new bootstrap.Modal(document.getElementById('modalCliente')).show();
    }
}

function eliminarCliente(id) {
    if (confirm('¿Eliminar este cliente?')) {
        fetch(`/api/clientes/${id}`, {method: 'DELETE'})
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    cargarClientes();
                    mostrarAlerta('Cliente eliminado', 'success');
                }
            });
    }
}

function limpiarFormCliente() {
    document.getElementById('cliente_id').value = '';
    document.getElementById('tipo').value = 'estudiante';
    document.getElementById('documento').value = '';
    document.getElementById('nombres').value = '';
    document.getElementById('apellidos').value = '';
    document.getElementById('telefono').value = '';
    document.getElementById('email').value = '';
    document.getElementById('direccion').value = '';
}

document.addEventListener('DOMContentLoaded', () => {
    cargarClientes();
    document.getElementById('buscarCliente').addEventListener('keyup', (e) => {
        const search = e.target.value.toLowerCase();
        const filtrados = clientesData.filter(c => 
            c.documento.toLowerCase().includes(search) ||
            c.nombres.toLowerCase().includes(search) ||
            c.apellidos.toLowerCase().includes(search)
        );
        mostrarClientes(filtrados);
    });
});
</script>
{% endblock %}
