<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tienda FUNCA{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-store"></i> Tienda FUNCA
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/productos"><i class="fas fa-boxes"></i> Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/categorias"><i class="fas fa-tags"></i> Categorías</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ventas"><i class="fas fa-shopping-cart"></i> Ventas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/compras"><i class="fas fa-truck"></i> Compras</a></li>
                    <li class="nav-item"><a class="nav-link" href="/inventario"><i class="fas fa-clipboard-list"></i> Inventario</a></li>
                    <li class="nav-item"><a class="nav-link" href="/clientes"><i class="fas fa-users"></i> Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reportes"><i class="fas fa-chart-line"></i> Reportes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/proveedores"><i class="fas fa-truck"></i> Proveedores</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pedidos"><i class="fas fa-clipboard-list"></i> Pedidos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reporte-pedidos"><i class="fas fa-file-alt"></i> Reporte Pedidos</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container-fluid mt-4">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/script.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
